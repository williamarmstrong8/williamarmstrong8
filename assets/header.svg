<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f0c29"/>
      <stop offset="50%" stop-color="#302b63"/>
      <stop offset="100%" stop-color="#24243e"/>
    </linearGradient>
    <linearGradient id="text" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ff6ec4">
        <animate attributeName="stop-color" values="#ff6ec4;#7873f5;#4ade80;#ff6ec4" dur="8s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#7873f5">
        <animate attributeName="stop-color" values="#7873f5;#4ade80;#ff6ec4;#7873f5" dur="8s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="40"/></filter>
    <style>
      .title { font: 800 76px 'Segoe UI', Helvetica, Arial, sans-serif; letter-spacing: -2px; }
      .sub { font: 400 24px 'Segoe UI', Helvetica, Arial, sans-serif; fill: #c7c4ff; letter-spacing: 6px; opacity: 0; animation: fade 1.2s ease-out .6s forwards; }
      .title { opacity: 0; animation: rise 1.2s cubic-bezier(.2,.8,.2,1) forwards; }
      .star { fill: #fff; animation: twinkle 3s ease-in-out infinite; }
      @keyframes rise { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }
      @keyframes fade { to { opacity: .9; } }
      @keyframes twinkle { 0%,100% { opacity: .15; } 50% { opacity: .9; } }
    </style>
  </defs>

  <rect width="1200" height="360" rx="24" fill="url(#bg)"/>

  <!-- drifting glow orbs -->
  <g filter="url(#blur)" opacity=".75">
    <circle cx="200" cy="120" r="110" fill="#ff6ec4">
      <animate attributeName="cx" values="200;320;200" dur="14s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="120;220;120" dur="11s" repeatCount="indefinite"/>
    </circle>
    <circle cx="980" cy="240" r="130" fill="#7873f5">
      <animate attributeName="cx" values="980;860;980" dur="16s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="240;130;240" dur="12s" repeatCount="indefinite"/>
    </circle>
    <circle cx="600" cy="330" r="90" fill="#4ade80" opacity=".6">
      <animate attributeName="cx" values="600;700;500;600" dur="18s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- stars -->
  <g>
    <circle class="star" cx="90" cy="60" r="1.6"/>
    <circle class="star" cx="260" cy="300" r="1.2" style="animation-delay:.8s"/>
    <circle class="star" cx="410" cy="50" r="1.4" style="animation-delay:1.6s"/>
    <circle class="star" cx="760" cy="40" r="1.8" style="animation-delay:.4s"/>
    <circle class="star" cx="880" cy="310" r="1.2" style="animation-delay:2.2s"/>
    <circle class="star" cx="1110" cy="80" r="1.6" style="animation-delay:1.2s"/>
    <circle class="star" cx="1050" cy="290" r="1.3" style="animation-delay:2.6s"/>
    <circle class="star" cx="150" cy="200" r="1.1" style="animation-delay:1.9s"/>
    <circle class="star" cx="640" cy="80" r="1.2" style="animation-delay:.2s"/>
  </g>

  <!-- animated wave -->
  <path fill="#ffffff" fill-opacity=".05">
    <animate attributeName="d" dur="10s" repeatCount="indefinite"
      values="M0 290 Q300 250 600 290 T1200 290 V360 H0Z;
              M0 290 Q300 330 600 290 T1200 290 V360 H0Z;
              M0 290 Q300 250 600 290 T1200 290 V360 H0Z"/>
  </path>

  <text x="600" y="185" text-anchor="middle" class="title" fill="url(#text)">William Armstrong</text>
  <text x="600" y="235" text-anchor="middle" class="sub">BUILDER  ·  ENGINEER  ·  CREATOR</text>
</svg>
