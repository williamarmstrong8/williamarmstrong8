<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="120" viewBox="0 0 1200 120">
  <defs>
    <filter id="glow" x="-20%" y="-50%" width="140%" height="200%">
      <feGaussianBlur stdDeviation="2.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="bigglow" x="-20%" y="-50%" width="140%" height="200%">
      <feGaussianBlur stdDeviation="7" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="2" fill="#000" opacity=".28"/>
    </pattern>
    <radialGradient id="vignette" cx="50%" cy="50%" r="75%">
      <stop offset="60%" stop-color="#000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000" stop-opacity=".65"/>
    </radialGradient>
  </defs>
  <style>text { font-family: 'JetBrains Mono', 'SF Mono', SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace; white-space: pre; }</style>
  <rect width="1200" height="120" rx="18" fill="#0E0B07"/>
  <g filter="url(#glow)" text-anchor="middle">
    <text x="600" y="54" font-size="20" fill="#FFB547">off-screen: running with Happy Mile, shooting photos, rebooting JARVIS.</text>
    <text x="600" y="86" font-size="14" fill="#B9843A">systems-first · human-centered · built in san francisco</text>
  </g>
  <rect width="1200" height="120" fill="url(#scan)" pointer-events="none"/>
  <rect width="1200" height="120" fill="url(#vignette)" pointer-events="none"/>
  <rect y="-80" width="1200" height="80" fill="#FFB547" opacity=".035">
    <animate attributeName="y" values="-80;120" dur="7s" repeatCount="indefinite"/>
  </rect>
</svg>
